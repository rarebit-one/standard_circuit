inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/standard_circuit/rspec_support_spec.rb
    - spec/active_storage/service/standard_circuit_s3_service_shim_spec.rb
    - spec/integration/health_route_boot_spec.rb
    - spec/integration/mailer_retry_load_order_spec.rb

# spec/support/*_app.rb are not specs — they're standalone Rails boot scripts
# run as subprocesses, and their stdout IS the assertion surface.
RSpec/Output:
  Exclude:
    - spec/support/health_route_boot_app.rb
    - spec/support/mailer_retry_load_order_app.rb

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 20

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 4
